language_code\\\":\\\"zh-HK\\\",\\\"label\\\":\\\"Traditional Chinese\\\"}],\\\"ar\\\":[{\\\"label\\\":\\\"Arabic\\\",\\\"language_code\\\":\\\"ar\\\"}],\\\"zh-CN\\\":[{\\\"label\\\":\\\"Simplified Chinese\\\",\\\"language_code\\\":\\\"zh-CN\\\"},{\\\"label\\\":\\\"Traditional Chinese\\\",\\\"language_code\\\":\\\"zh-TW\\\"}],\\\"kn\\\":[{\\\"label\\\":\\\"Kannada\\\",\\\"language_code\\\":\\\"kn\\\"}],\\\"is\\\":[{\\\"language_code\\\":\\\"is\\\",\\\"label\\\":\\\"Icelandic\\\"}],\\\"nl\\\":[{\\\"language_code\\\":\\\"nl\\\",\\\"label\\\":\\\"Dutch\\\"}],\\\"sw\\\":[{\\\"label\\\":\\\"Swahili\\\",\\\"language_code\\\":\\\"sw\\\"}],\\\"ur\\\":[{\\\"label\\\":\\\"Urdu\\\",\\\"language_code\\\":\\\"ur\\\"}],\\\"pl\\\":[{\\\"label\\\":\\\"Polish\\\",\\\"language_code\\\":\\\"pl\\\"}],\\\"ca\\\":[{\\\"language_code\\\":\\\"ca\\\",\\\"label\\\":\\\"Catalan\\\"}],\\\"pt\\\":[{\\\"language_code\\\":\\\"pt\\\",\\\"label\\\":\\\"Portuguese\\\"}]},\\\"server_translation_mode\\\":\\\"off\\\",\\\"translation_description\\\":\\\"FAITHFUL, NATURAL, COMPLETE TARGET RENDERING\\\\nTranslate every meaning-bearing source unit exactly once and in order. Preserve actor, agency, grammatical number, action ownership, object, relation, negation, modality, tense/aspect, modifier scope, quantities, names, alternatives, repetitions, and meaningful layout. Do not narrow a generic term to a specific domain without context; do not change organizing/arranging/coordinating/reviewing into personally performing; do not drop small modifiers such as already, still, even, only, both, or not. Never leave an ordinary source-language word or phrase untranslated merely because it is awkward, rare, offensive, or difficult; translate it faithfully and discuss uncertainty briefly in prose. Names, identifiers, codes, and accepted unchanged loans may remain. If an essential malformed token truly prevents an honest rendering, clarify instead of guessing.\\\\n\\\\nDo not add facts, clauses, objects, relationships, emoji, tone, or completion. If the source ends mid-clause, after an adjective, or otherwise unfinished, the target must remain visibly unfinished. Preserve source-authored emoji but never invent one. When source gender or identity is unstated, use a natural neutral construction: for example prefer Russian “Мне хотелось бы/Я хочу” over “хотел(а) бы,” and Spanish impersonal or neutral wording over gendered “sincero/tóxico/acostado.” Never assume masculine/feminine and never use slash or parenthetical gender alternatives.\\\\n\\\\ntranslated_text contains one pure target rendering only—no source copy, label, explanation, gloss, pronunciation, transliteration, synonym stack, or assistant-created alternative. One ordinary request uses one primary card per destination. If the user explicitly asks for N variants, emit exactly N materially distinct complete cards. A plural request for translations/options/ways without N means exactly two materially distinct complete cards. Every requested complete alternative belongs in a card; prose explains only the distinctions.\\\",\\\"max_output_characters\\\":100000},\\\"enabled\\\":true,\\\"version\\\":\\\"trigger_v3333_translation_v3040_pronunciation\\\",\\\"pronunciation\\\":{\\\"outside_prose_description\\\":\\\"The card is the authoritative display of source_text and its single learner-facing pronunciation_hint. Outside prose is optional, not required. For a bare direct pronunciation request—especially a simple word or short phrase—default to the card alone. Add outside prose only when the user asks for explanation or when it contributes a materially useful stress, tone, articulation, contrast, rhythm, or ambiguity note that the card cannot show without repeating or re-encoding the complete target. Never repeat the complete pronunciation_hint verbatim, never reproduce the same complete learner-friendly cue in different formatting, and never merely say that the item is pronounced exactly as the card already shows. Do not include IPA or another secondary transcription solely because it is available. Include IPA or another complementary notation only when the user explicitly requests it or when it is materially needed to teach or distinguish a difficult or ambiguous sound, accent-specific reading, or established pronunciation contrast. For an ordinary easy word or phrase, omit IPA and give at most one brief useful sentence about stress, syllables, tones, articulation, or a common mistake without repeating the card. When unrequested IPA is materially useful, pair it with a concrete stress, syllable, tone, articulation, or sound-contrast explanation rather than presenting a bare second transcription. If the user requests both a readable cue and IPA, keep the readable cue in the card and provide IPA in prose. If the user explicitly requests IPA only, put IPA in the card and do not duplicate it in prose. For Mandarin, Cantonese, Japanese, and Korean, keep the standard learner romanization in the card; prose may add a focused tone, rhythm, or sound note, but not a second complete approximation unless requested or materially necessary. For a long sentence or passage, never reproduce a full-sentence IPA or second full transcription unless the user explicitly requests it; focus prose only on difficult words or sounds. When explanation is requested or materially helpful, richer prose may explain stress, syllables, tones, linking, rhythm, mouth position, sound contrasts, regional or register variation, ambiguity, etymology, examples, or common mistakes. It may quote a short fragment when necessary for that explanation, but it must not reproduce the complete source-and-hint pair as a standalone duplicate. If the user asks for card only or no explanation, emit no outside prose and therefore no secondary notation unless the requested notation itself belongs in the card. For targets with multiple accepted pronunciations, label and compare the variants in prose while keeping each complete reading in its own card. Cover every requested item. Do not promise, propose, or ask a follow-up question after a resolved answer.\\\\n\\\\nFINAL DE-DUPLICATION AUDIT\\\\nAfter drafting outside prose, compare every learner-facing respelling or romanization sequence against pronunciation_hint. Remove any sequence that re-encodes the complete target, even when capitalization, stress casing, spaces, hyphens, syllable boundaries, punctuation, or approximate vowel spellings differ. The card already supplies the complete cue. For a stress note, say only which syllable is stressed (for example, \\\\\\\"Stress the first syllable\\\\\\\"), not a second spelling such as \\\\\\\"MIR-a-cles.\\\\\\\" For Japanese rhythm, describe the number of morae and any long vowel without rewriting the complete romaji with separators. Short fragments are allowed only when necessary to teach one specific sound or mouth movement; never concatenate them into a second full-target cue.\\\",\\\"continuation_description\\\":\\\"CONTINUATION RULES\\\\nUse pronunciation after an earlier result only when the newest request explicitly selects exact user-authored text and its reading or locale, and that span still occurs exactly once across all visible user text under newline-equivalent grounding. New bare user text becomes the new source. If a deictic request selects only assistant-rendered text, emit zero cards and answer normally or ask the user to paste it. Ignore unrelated requests and opt-outs.\\\\n\\\\nACTIVE-TARGET CONTINUATIONS\\\\nWhen the newest turn is a correction, complaint, confirmation, or phonetic attempt that plainly refers to one still-active pronunciation target established by an earlier visible user request, inherit that exact earlier user-authored target and its language or locale. A newest request such as each sentence or these lines may also select one uniquely identifiable earlier user-authored passage; it remains eligible even when an assistant echoed it, so do not ask the user to resend it. The newest complaint or phonetic attempt is evidence about the target, never a new source_text. Ordinary deictic voice requests do not revive an older source across intervening competing utterances. If more than one earlier target remains plausible, emit no card and ask one concise clarification.\\\",\\\"max_hint_characters\\\":2000,\\\"max_source_characters\\\":2000,\\\"overview_description\\\":\\\"MANDATORY EXPLICIT-IPA TOOL RULE\\\\nWhen the user asks for IPA of an exact visible target, the Pronunciation tool call is mandatory whenever normal eligibility and grounding checks pass. Never satisfy that request with IPA in ordinary prose only. The word \\\\\\\"only\\\\\\\" means the card contains only IPA and outside prose is empty; it never means to omit the card. Literal example: \\\\\\\"Give me only the IPA for squirrel.\\\\\\\" Required behavior: emit exactly one Pronunciation card with source_text \\\\\\\"squirrel\\\\\\\", pronunciation_hint containing only the IPA transcription, the appropriate English playback locale, and no outside prose. A prose-only answer such as /ˈskwɝəl/ is forbidden.\\\\n\\\\nHARD ROUTING OVERRIDES\\\\nAn explicit request for IPA of an exact visible word, phrase, sentence, or small set is a pronunciation request, including wording such as \\\\\\\"only the IPA.\\\\\\\" Emit a Pronunciation card; use IPA as its one and only pronunciation_hint and emit no outside prose unless the user separately requests explanation. \\\\\\\"Only\\\\\\\" limits notation and prose, not the card or audio. A request for the complete written romanization or transliteration of a poem, verse, lyrics, prayer, passage, or document is a written transformation, not a pronunciation card request, unless the user explicitly asks to hear or practice it.\\\\n\\\\nPRECEDENCE AND SAFETY\\\\nApply rules in this order: (1) eligibility and resolver safety, (2) intent routing, (3) exact source-and-reading selection, (4) pronunciation fidelity, then (5) outside prose. A direct request must call the matching tool only after every higher-priority prerequisite passes. Otherwise emit no language-learning call and answer normally or ask one concise clarification. Never call translation and pronunciation for the same exact source span, never call merely to expose fallback or alt text, and never claim that a card exists or survived resolution.\\\\n\\\\nSOURCE AND ALIGNMENT GATES\\\\nBefore each Pronunciation call, resolve exactly one visible user-authored source target for that call. A small explicit set may produce one call per target, and one source target may produce multiple calls only under the established-multiple-readings rule. An earlier user-authored passage remains eligible when the newest request uniquely selects it by structure or content even if an assistant echoed or explained it; never demand re-paste merely because an echo exists. A correction or phonetic attempt may inherit one unique active earlier target. By contrast, an ordinary deictic request to hear, repeat, or voice something must not revive an older source when two or more prior utterances are plausible or intervening turns introduced competing sources; emit zero cards and ask one concise clarification rather than choosing a convenient or most recent candidate. This ambiguity stop outranks script match, recency, a prior card, and the mere availability of any older exact text. If the newest turn contains no literal target, do not break such ambiguity by recency, script match, an assistant echo, or a prior card. Also stop before any card when the typed source is likely a misspelling of a known lexical or technical term and the intended corrected spelling is not explicitly confirmed. Hidden playback may never silently correct, normalize, or replace visible lexical identity. Ask whether the user meant the likely correction; only after confirmation may a card use one identical confirmed lexical form for visible source, hint, and playback. For an invented name without one visible settled reading, explain that the reading is not inherent and offer or ask the user to choose a reading in prose; emit no audio card until that reading is confirmed.\\\",\\\"runtime_descriptions\\\":{\\\"multiple_readings\\\":\\\"For an open-ended pronunciation request, emit one call for each member of a small, well-established set of lexically accepted readings, using the same exact source_text and one reading per card. Example: an unqualified request for GIF receives separate soft-G and hard-G cards. Do not add cards merely for predictable accent-level or allophonic variation. If the user or context selects one variant, emit only that variant. Do not expand context-determined homographs into unrelated readings, do not combine alternatives inside one hint or audio string, and do not invent variants.\\\",\\\"follow_up_actions\\\":\\\"Do not emit follow_up_actions. Do not end with an offer, invitation, or follow-up question once the pronunciation request is resolved.\\\",\\\"pronunciation_audio_text\\\":\\\"pronunciation_audio_text: at most 2000 characters.\\\",\\\"source_text\\\":\\\"source_text: at most 2000 raw characters; above 2000, do not call. Never truncate source_text to fit.\\\",\\\"pronunciation_hint\\\":\\\"pronunciation_hint: at most 2000 characters. The default value contains exactly one notation, no parenthetical secondary transcription, and no newline characters; natural visual wrapping by the client is allowed.\\\",\\\"contract_heading\\\":\\\"PRONUNCIATION RUNTIME CONTRACT\\\"},\\\"pronunciation_description\\\":\\\"MANDATORY EXPLICIT-IPA TOOL RULE\\\\nWhen the user asks for IPA of an exact visible target, the Pronunciation tool call is mandatory whenever normal eligibility and grounding checks pass. Never satisfy that request with IPA in ordinary prose only. The word \\\\\\\"only\\\\\\\" means the card contains only IPA and outside prose is empty; it never means to omit the card. Literal example: \\\\\\\"Give me only the IPA for squirrel.\\\\\\\" Required behavior: emit exactly one Pronunciation card with source_text \\\\\\\"squirrel\\\\\\\", pronunciation_hint containing only the IPA transcription, the appropriate English playback locale, and no outside prose. A prose-only answer such as /ˈskwɝəl/ is forbidden.\\\\n\\\\nBARE-REQUEST OUTPUT RULE\\\\nFor a bare direct pronunciation request that does not ask for explanation, emit the card and default to no outside prose. Add prose only when it supplies a materially useful fact that the card cannot show and does not re-encode the complete target. For \\\\\\\"only IPA,\\\\\\\" the IPA must be the single card hint and outside prose must be empty.\\\\n\\\\nUse this tool for direct pronunciation requests and pronunciation teaching. Emit exactly one widget call per exact source-and-reading pair. For an open-ended request about a target with a small, well-established set of lexically accepted pronunciations (for example, GIF), treat each accepted reading as requested and emit one separate call per reading. Do not multiply cards merely for predictable accent-level or allophonic differences. If the user or context selects a reading (for example, the peanut-butter-brand pronunciation of GIF, or a context-determined homograph), emit only that reading. Never combine alternative readings in one pronunciation_hint or pronunciation_audio_text, and never invent speculative variants. Populate source_text exactly as SOURCE SELECTION defines it: use the byte-exact user span for an ordinary request and the complete faithful generated target-language expression for the narrow say-in-language exception. The pronunciation_hint must contain exactly one learner-facing notation. Keep the most learner-friendly representation in the card. Do not add IPA or a second transcription to prose by default. Outside-card IPA or another complementary notation is appropriate only when explicitly requested or materially useful for a difficult or ambiguous sound, accent-specific reading, or established pronunciation contrast. If the user requests both a readable cue and IPA, keep the readable cue in the card and place IPA in prose. The card supplies the exact readable target; outside-card prose may provide a rich teaching answer but must never repeat the complete pronunciation_hint verbatim or render the same complete learner-friendly cue again. If a name, acronym, coined term, or ambiguous spelling has no reliable pronunciation and the context does not resolve it, ask for the intended reading instead of guessing. Do not emit partial, placeholder, or unresolved cards. An explicit request for IPA of an exact target—including \\\\\\\"only the IPA\\\\\\\"—is still a direct pronunciation request and must emit a Pronunciation card with the requested IPA as its single pronunciation_hint so playback remains available. If the user requests both a readable cue and IPA, card only the readable cue and put only the IPA plus genuinely useful teaching in prose; do not add a second complete readable respelling in prose.\\\",\\\"max_audio_text_characters\\\":2000,\\\"source_selection_description\\\":\\\"SOURCE SELECTION\\\\nFor an ordinary pronunciation request, identify the exact complete user-authored source span requested in the newest message; after newline-equivalent uniqueness checks, copy that raw span byte-for-byte. One narrow exception applies to a short direct 'how do you say \u003csource expression\u003e in \u003ctarget language\u003e' request: source_text is the faithful target-language expression that answers the request, not the source-language words inside the command. For example, 'how do you say hello in Chinese' cards the Chinese expression 你好, never the English word hello. This exception is allowed only when the source expression, target language, and one conventional target rendering are unambiguous. Otherwise ask one concise clarification. Never reconstruct inaccessible media or attachment text.\\\",\\\"parameter_descriptions\\\":{\\\"pronunciation_audio_text\\\":\\\"pronunciation_audio_text: Optional hidden playback input for exactly the same canonical reading as source_text and pronunciation_hint. Use ordinary text in pronunciation_language; never put IPA, explanations, stress marks, alternatives, or a foreign-language approximation here. Omit it when native-script source_text is already the best playback input. After a card is selected, if ambiguous or unfamiliar source_text plus locale would speak the wrong hint, use the shortest same-language literal respelling that speaks only the hint; distinct readings need distinct values (e.g. \\\\\\\"giff\\\\\\\"/\\\\\\\"jiff\\\\\\\", \\\\\\\"taow\\\\\\\"). This field cannot change playback speed. For a request to slow audio, never claim the speed changed or distort spelling; omit the card and explain the limitation unless a separate exact user-authored slower practice unit can be carded truthfully. Never use this hidden field to silently correct a likely typo or change lexical identity. If faithful playback would require a spelling correction rather than a same-reading respelling, ask for confirmation before calling the tool; visible source_text, hint, and playback must stay aligned.\\\",\\\"pronunciation_hint\\\":\\\"MANDATORY EXPLICIT-IPA TOOL RULE\\\\nWhen the user asks for IPA of an exact visible target, the Pronunciation tool call is mandatory whenever normal eligibility and grounding checks pass. Never satisfy that request with IPA in ordinary prose only. The word \\\\\\\"only\\\\\\\" means the card contains only IPA and outside prose is empty; it never means to omit the card. Literal example: \\\\\\\"Give me only the IPA for squirrel.\\\\\\\" Required behavior: emit exactly one Pronunciation card with source_text \\\\\\\"squirrel\\\\\\\", pronunciation_hint containing only the IPA transcription, the appropriate English playback locale, and no outside prose. A prose-only answer such as /ˈskwɝəl/ is forbidden.\\\\n\\\\nGive one complete pronunciation for exactly source_text. The default pronunciation_hint is exactly one logical string containing exactly one learner-facing notation. Do not append IPA or another transcription in parentheses, after a separator, or on another line. Do not emit any newline, carriage return, Unicode line separator, blank line, bullet, label, or Markdown line break; allow the UI to wrap long text naturally. Use the most learner-usable notation in the card: tone-marked Hanyu Pinyin for Mandarin; Jyutping with tone digits for Cantonese; standard Hepburn romaji with macrons for Japanese; standard Revised Romanization for Korean; and a conventional readable learner respelling in the user's instruction language or script for every other language. Do not put IPA or a secondary notation in prose merely because it is available. IPA or another complementary notation may appear outside the card only when the user explicitly requests it or when it is materially needed to teach or distinguish a difficult or ambiguous sound, accent-specific reading, or established pronunciation contrast. If the user explicitly requests IPA or another notation only, that requested notation becomes the single card notation. If the user requests both a learner-friendly cue and IPA, keep the learner-friendly cue in the card and put IPA in prose. Never abbreviate, ellipsize, or truncate the requested pronunciation; if the complete hint would exceed the runtime maximum, emit no card. Do not put meanings, glosses, explanations, alternative readings, or dialect labels in the hint, and do not mix notation systems inside it. Put every alternative accepted reading in a separate widget call. Before returning, verify that outside prose does not recreate this complete hint with altered capitalization, hyphenation, spaces, syllable boundaries, punctuation, or equivalent learner respelling.\\\",\\\"source_text\\\":\\\"source_text: For ordinary pronunciation, use the byte-exact raw user span approved by the grounding gate. For a short direct 'how do you say \u003csource expression\u003e in \u003ctarget language\u003e' request, use the complete faithful target-language expression that answers the request; do not use the source-language phrase or the whole command. Preserve the target expression's natural script, case, punctuation, whitespace, and every token. If the target expression is ambiguous or has no reliable conventional rendering, emit zero calls and clarify.\\\",\\\"contract_heading\\\":\\\"PRONUNCIATION PARAMETER CONTRACT\\\",\\\"pronunciation_language\\\":\\\"pronunciation_language: Required BCP-47 playback locale for source_text. For a short direct 'how do you say X in Y' request, use language Y, because source_text is the generated Y-language expression. For ordinary requests, choose the language and locale of the requested utterance, not the instruction language or name origin. If one locale is not unambiguous, emit zero calls and clarify.\\\"},\\\"routing_description\\\":\\\"MANDATORY EXPLICIT-IPA TOOL RULE\\\\nWhen the user asks for IPA of an exact visible target, the Pronunciation tool call is mandatory whenever normal eligibility and grounding checks pass. Never satisfy that request with IPA in ordinary prose only. The word \\\\\\\"only\\\\\\\" means the card contains only IPA and outside prose is empty; it never means to omit the card. Literal example: \\\\\\\"Give me only the IPA for squirrel.\\\\\\\" Required behavior: emit exactly one Pronunciation card with source_text \\\\\\\"squirrel\\\\\\\", pronunciation_hint containing only the IPA transcription, the appropriate English playback locale, and no outside prose. A prose-only answer such as /ˈskwɝəl/ is forbidden.\\\\n\\\\nHARD ROUTING CHECK\\\\nFirst, treat every explicit IPA request for an exact target as Pronunciation-card eligible. \\\\\\\"Only IPA\\\\\\\" means one IPA hint in the card and no prose; it never means prose-only IPA. Second, treat a request for complete written romanization or transliteration of a poem, verse, lyrics, prayer, passage, or document as a writing transformation with zero Pronunciation cards unless the user explicitly asks to hear or practice the text. These two decisions override generic romanize/transliterate wording below.\\\\n\\\\nROUTING RULES\\\\nAfter safety prerequisites pass, use pronunciation when the primary goal is to hear, learn, sound out, romanize, transliterate, or practice an exact word, phrase, sentence, or small explicit set. Also use pronunciation for a short direct say request of the form 'how do you say \u003csource expression\u003e in \u003ctarget language\u003e' (and localized equivalents): first determine the faithful target-language expression, then card that target expression with its canonical pronunciation. A whole-document rewrite, script conversion, replace-all request, spelling check, punctuation edit, or formatting-preservation workflow is a writing transformation and must not emit a pronunciation card. Use translation for other explicit requests to render visible text into a target language. The newest request controls intent, locale, notation, and grouping. Honor opt-outs and never call translation and pronunciation for the same source span.\\\\n\\\\nWRITTEN-ONLY MODALITY\\\\nA request for written transliteration or romanization of a long passage, document, prayer, or verse collection is a written transformation even when the user calls it pronunciation: emit no pronunciation card or audio and answer in the requested accurate written convention. When original script is visible, derive each transliterated unit directly from that script rather than from a prior transliteration, memory, or a nearby conventional phrase. This does not suppress a request to hear or practice an exact small word, phrase, sentence, or explicit small set. Never convert a genuinely unresolved referent into a guessed card.\\\\n\\\\nIPA AND WRITTEN-TRANSFORMATION ROUTING\\\\nA request for IPA of an exact word, phrase, sentence, or small explicit set is a pronunciation request even when the user says \\\\\\\"only IPA\\\\\\\"; emit a Pronunciation card and use IPA as the single card hint unless the user explicitly opts out of a card or audio. Conversely, a request whose primary deliverable is the complete written romanization or transliteration of a poem, verse, lyrics, prayer, passage, document, or other extended text is a written transformation and must not emit a Pronunciation card—especially when the user says not to teach or explain pronunciation. This written-only exclusion applies even when the source is a single short poem or verse; length alone does not make it a pronunciation lesson.\\\"}},\\\"enable_math_block_always_prefetch_v2\\\":false,\\\"enable_lb_physics_motion_forces_always_prefetch\\\":false,\\\"learning_visualization_prompt_key\\\":\\\"\\\",\\\"enable_visual_concept_widget\\\":false,\\\"enable_learning_blocks_group_keywords\\\":true,\\\"use_alternate_lb_groups\\\":\\\"\\\",\\\"enable_graphable_function_v2\\\":true},\\\"id_type\\\":\\\"userID\\\",\\\"is_device_based\\\":false,\\\"group_name\\\":\\\"alpha_candidate_test\\\",\\\"is_experiment_active\\\":true,\\\"is_user_in_experiment\\\":true,\\\"allocated_experiment_name\\\":\\\"94228759\\\",\\\"explicit_parameters\\\":[\\\"language_learning_block_widget_config\\\",\\\"enable_pronunciation_block_v4_audio_fix_v2\\\"],\\\"undelegated_secondary_exposures\\\":[{\\\"gate\\\":\\\"3879460227\\\",\\\"gateValue\\\":\\\"false\\\",\\\"ruleID\\\":\\\"default\\\"},{\\\"gate\\\":\\\"1237525916\\\",\\\"gateValue\\\":\\\"false\\\",\\\"ruleID\\\":\\\"default\\\"},{\\\"gate\\\":\\\"790117001\\\",\\\"gateValue\\\":\\\"false\\\",\\\"ruleID\\\":\\\"default\\\"},{\\\"gate\\\":\\\"2067628123\\\",\\\"gateValue\\\":\\\"false\\\",\\\"ruleID\\\":\\\"3CuBjEMi97tY3EGnq0NA9s\\\"},{\\\"gate\\\":\\\"213562696\\\",\\\"gateValue\\\":\\\"false\\\",\\\"ruleID\\\":\\\"default\\\"},{\\\"gate\\\":\\\"2691265090\\\",\\\"gateValue\\\":\\\"false\\\",\\\"ruleID\\\":\\\"default\\\"},{\\\"gate\\\":\\\"
